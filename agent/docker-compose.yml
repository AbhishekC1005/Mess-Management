services:
  agent:
    build: .
    container_name: mess-agent
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_MODEL_NAME: ${LITELLM_MODEL_NAME:-gemini/gemini-1.5-flash}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:8080/api}
      BACKEND_API_KEY: ${BACKEND_API_KEY:-agent-secret-key-change-me}
      DATABASE_URL: ${DATABASE_URL}
      AGENT_PORT: 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
