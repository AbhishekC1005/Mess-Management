services:
  app:
    build: .
    container_name: mess-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db-mess-management.c18gwquak8j5.ap-south-1.rds.amazonaws.com:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: abhishek4
      JWT_SECRET: ${JWT_SECRET:-thisIsAVeryLongSecretKeyForMessManagementApplication123456}
      CORS_ORIGINS: http://localhost:5173
      AGENT_API_KEY: ${AGENT_API_KEY:-agent-secret-key-change-me}
